name: build-ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: dsh-ios-build
  cancel-in-progress: true

env:
  NODE_V: "20.19.0"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (tooling)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 0) 有预编译 node 就直接拿（分钟级），没有才现编
      - name: Download prebuilt node (if release exists)
        id: prebuilt
        run: |
          mkdir -p resources
          if gh release view node-bin >/dev/null 2>&1; then
            gh release download node-bin --pattern "node-ios-arm64" --clobber -D /tmp/nodebin || true
            echo "--- 下载物诊断 ---"
            ls -la /tmp/nodebin/ 2>/dev/null || echo "!! /tmp/nodebin 空"
            # Mach-O 64-bit 魔数校验（python3 判读，跨平台稳，无 heredoc 防 YAML 截断）
            if python3 -c "import os,sys; p='/tmp/nodebin/node-ios-arm64'; ok=os.path.exists(p) and open(p,'rb').read(4)==bytes.fromhex('cffaedfe'); print('size=',os.path.getsize(p) if os.path.exists(p) else 0,'VERIFY','OK' if ok else 'BAD'); sys.exit(0 if ok else 1)"; then
              cp /tmp/nodebin/node-ios-arm64 resources/node
              chmod +x resources/node
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "✅ 复用预编译 node"
              ls -la resources/node
            else
              echo "!! 预编译 node 验证失败，走现编"; rm -rf resources/node
            fi
          else
            echo "!! 无 node-bin release，走现编"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # 1) 在 runner 上安装 dsh（含 web 客户端 + 全套插件），作为 bundle 资源
      - name: Install dsh bundle
        run: |
          mkdir -p resources/dsh
          cd resources/dsh
          npm init -y >/dev/null
          npm install @deepseek-ai/dsh@latest 2>&1 | tail -5
          echo "--- dsh ---"
          du -sh node_modules
          ls node_modules/@deepseek-ai/ | wc -l

      # 1.5) 冒烟测试：验证 dsh web 入口与 token 流程（分别用 node22 与装机版 node20）
      - name: Smoke test dsh web (node22 + node20)
        run: |
          cd resources/dsh
          ENTRY=node_modules/@deepseek-ai/dsh/lib/bin.js
          ls -la "$ENTRY" || { echo "!! 入口缺失"; ls node_modules/@deepseek-ai/dsh/; exit 1; }
          # 拉取装机同款 node v20.19.0 (darwin-arm64)
          curl -fsSL -o /tmp/n20.tar.gz "https://nodejs.org/dist/v20.19.0/node-v20.19.0-darwin-arm64.tar.gz"
          mkdir -p /tmp/n20 && tar xzf /tmp/n20.tar.gz -C /tmp/n20 --strip-components=1
          /tmp/n20/bin/node --version
          for NODE_BIN in "$(which node)" /tmp/n20/bin/node; do
            echo "########## 冒烟: $($NODE_BIN --version) ##########"
            rm -f /tmp/smoke.log
            ($NODE_BIN "$ENTRY" web --no-open --port 3280 > /tmp/smoke.log 2>&1 &)
            sleep 18
            TOKEN=$(grep -oE 'token=[A-Za-z0-9_-]{6,}' /tmp/smoke.log | head -1 | sed 's/token=//')
            echo "TOKEN=${TOKEN:0:6}... len=${#TOKEN}"
            if [ -n "$TOKEN" ]; then
              CODE=$(curl -s -c /tmp/cj -o /tmp/p.html -w "%{http_code}" "http://127.0.0.1:3280/?token=$TOKEN")
              CODE2=$(curl -s -b /tmp/cj -o /tmp/p2.html -w "%{http_code}" "http://127.0.0.1:3280/")
              echo "exchange=$CODE plain_with_cookie=$CODE2"
              grep -q "<!doctype html" /tmp/p2.html && echo "HTML ✅" || { echo "HTML ❌"; head -c 200 /tmp/p2.html; }
            else
              echo "!! 未打印 token，smoke.log:"; cat /tmp/smoke.log
            fi
            pkill -f "web --no-open --port 3280" 2>/dev/null || true
            sleep 2
          done
          exit 0

      # 2) 没有预编译 node 才交叉编译（ninja 配方；跨编译较慢，首次 1.5-2h）
      - name: Install ninja (1.10.2, 支持 dupbuild=warn)
        if: steps.prebuilt.outputs.found != 'true'
        run: |
          curl -fsSL -o /tmp/ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.10.2/ninja-mac.zip
          unzip -o -q /tmp/ninja.zip -d /tmp/ninja-bin
          echo "/tmp/ninja-bin" >> "$GITHUB_PATH"
          ninja --version

      - name: Build Node for iOS (若需)
        if: steps.prebuilt.outputs.found != 'true'
        run: bash scripts/build_node_ios.sh

      - name: Upload node binary to node-bin release (缓存复用)
        if: steps.prebuilt.outputs.found != 'true'
        continue-on-error: true   # 缓存上传失败不阻塞 IPA 构建
        run: |
          test -f resources/node || { echo "!! resources/node 不存在，跳过缓存上传"; exit 1; }
          if gh release view node-bin >/dev/null 2>&1; then
            gh release upload node-bin resources/node --clobber
          else
            gh release create node-bin resources/node --title "node-ios-arm64" --notes "Node v20.19.0 for iOS arm64 (交叉编译产物)"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      # node 二进制 artifact 兜底：run 任何后续步骤挂掉都能从 artifact 捞回，免重编 45 分钟
      - name: Upload node binary (artifact 兜底)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: node-ios-arm64-bin
          path: resources/node
          if-no-files-found: warn

      # 3) 装配进工程资源目录
      - name: Assemble app resources
        run: bash scripts/assemble_resources.sh

      # 4) xcodegen + 构建 IPA
      - name: Generate project
        run: |
          brew install xcodegen >/dev/null 2>&1 || brew upgrade xcodegen >/dev/null 2>&1 || true
          which xcodegen

      - name: Upload node build log (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node_build_log
          path: /tmp/node_build.log
          if-no-files-found: warn

      - name: Build IPA
        run: bash scripts/build_ipa.sh

      # 5) 归档/上传
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh助手_ipa
          path: dist/dsh助手_V1.ipa

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        run: |
          set -e
          TAG="V1"
          gh release view "$TAG" 2>/dev/null && gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" "dist/dsh助手_V1.ipa" \
            --title "dsh助手 V1" \
            --notes "iOS 版 dsh 助手（内嵌 Node + dsh 智能体 + 原生外壳）" || true
        env:
          GH_TOKEN: ${{ github.token }}